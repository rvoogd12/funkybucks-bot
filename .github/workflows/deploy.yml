name: Deploy to Orihost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.ORIHOST_SFTP_HOST }}
          username: ${{ secrets.ORIHOST_SFTP_USER }}
          password: ${{ secrets.ORIHOST_SFTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.ORIHOST_REMOTE_DIR }}/
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/data/**
