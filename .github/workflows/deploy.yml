name: Deploy to Orihost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show files to deploy
        run: |
          echo "Local files:"
          ls -la
          test -f app.js
          test -f commands.js

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.ORIHOST_SFTP_HOST }}
          SFTP_USER: ${{ secrets.ORIHOST_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.ORIHOST_SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.ORIHOST_SFTP_PORT }}
          REMOTE_DIR: ${{ secrets.ORIHOST_REMOTE_DIR }}
        run: |
          set -euo pipefail

          missing=""
          [[ -z "${SFTP_HOST:-}" ]] && missing+="ORIHOST_SFTP_HOST "
          [[ -z "${SFTP_USER:-}" ]] && missing+="ORIHOST_SFTP_USER "
          [[ -z "${SFTP_PASSWORD:-}" ]] && missing+="ORIHOST_SFTP_PASSWORD "
          if [[ -n "$missing" ]]; then
            echo "Missing GitHub secrets: $missing"
            exit 1
          fi

          HOST="${SFTP_HOST#sftp://}"
          HOST="${HOST#ssh://}"
          HOST="${HOST%/}"

          REMOTE="${REMOTE_DIR:-.}"
          case "$REMOTE" in
            /home/container|/home/container/)
              echo "ORIHOST_REMOTE_DIR was $REMOTE — using . instead (SFTP is already chrooted to /home/container)"
              REMOTE="."
              ;;
          esac

          sudo apt-get update
          sudo apt-get install -y lftp

          echo "Deploying to $HOST:${SFTP_PORT:-22} -> $REMOTE"
          echo "Local app.js size: $(wc -c < app.js) bytes"

          # Server-only paths to never touch (Orihost creates these via npm install).
          EXCLUDES=(
            -X ^node_modules/
            -X ^\.npm/
            -X ^\.npm-cache/
            -X ^\.cache/
            -X ^\.env$
            -X ^\.git/
            -X ^cloudflared$
            -X ^data/accounts\.json$
            -X ^data/gardens\.json$
          )

          LFTP_SCRIPT=$(mktemp)
          {
            echo "set sftp:auto-confirm yes"
            echo "set net:timeout 60"
            echo "set net:max-retries 3"
            echo "set cmd:parallel 4"
            echo "pwd"
            # --only-newer: upload changed files only.
            # No --delete: avoids hanging while removing remote node_modules/.npm trees.
            echo "mirror --reverse --only-newer ${EXCLUDES[*]} ./ ${REMOTE}"
            echo "bye"
          } > "$LFTP_SCRIPT"

          echo "lftp script:"
          cat "$LFTP_SCRIPT"

          lftp -u "$SFTP_USER,$SFTP_PASSWORD" -p "${SFTP_PORT:-22}" "sftp://$HOST" < "$LFTP_SCRIPT"
          rm -f "$LFTP_SCRIPT"

          echo "Deploy finished."
