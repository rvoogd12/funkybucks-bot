name: Deploy to Orihost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Orihost via SFTP
        env:
          SFTP_HOST: ${{ secrets.ORIHOST_SFTP_HOST }}
          SFTP_USER: ${{ secrets.ORIHOST_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.ORIHOST_SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.ORIHOST_SFTP_PORT }}
          REMOTE_DIR: ${{ secrets.ORIHOST_REMOTE_DIR }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "${SFTP_PORT:-22}" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          mirror --reverse --delete --verbose --exclude-glob .git --exclude-glob .github --exclude-glob node_modules --exclude-glob .env ./ "$REMOTE_DIR"
          bye
          EOF
