name: Deploy to Orihost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SFTP (lftp)
        env:
          SFTP_HOST: ${{ secrets.ORIHOST_SFTP_HOST }}
          SFTP_USER: ${{ secrets.ORIHOST_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.ORIHOST_SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.ORIHOST_SFTP_PORT }}
          REMOTE_DIR: ${{ secrets.ORIHOST_REMOTE_DIR }}
        run: |
          set -e
          echo "Deploying to $SFTP_HOST:$SFTP_PORT -> $REMOTE_DIR"
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -d -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://${SFTP_HOST}:${SFTP_PORT:-22}" -e "set sftp:auto-confirm yes; set net:timeout 10; set net:max-retries 2; mirror --reverse --delete --verbose ./ \"$REMOTE_DIR\"; bye"
