name: Deploy to Orihost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.0
        with:
          server: de-02.orihost.com
          port: 2022
          username: ${{ secrets.ORIHOST_SFTP_USER }}
          password: ${{ secrets.ORIHOST_SFTP_PASSWORD }}
          local_path: ./
          remote_path: ${{ secrets.ORIHOST_REMOTE_DIR }}/
          delete: false
          sftpArgs: -o IdentitiesOnly=yes
