name: Deploy to Orihost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SFTP (rsync over SSH)
        env:
          SFTP_HOST: ${{ secrets.ORIHOST_SFTP_HOST }}
          SFTP_USER: ${{ secrets.ORIHOST_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.ORIHOST_SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.ORIHOST_SFTP_PORT }}
          REMOTE_DIR: ${{ secrets.ORIHOST_REMOTE_DIR }}
        run: |
          set -e
          HOST="${SFTP_HOST#sftp://}"
          HOST="${HOST%/}"
          echo "Deploying to $HOST:$SFTP_PORT -> $REMOTE_DIR"
          sudo apt-get update
          sudo apt-get install -y sshpass lftp
          echo "Checking SFTP login to $HOST..."
          printf "bye\n" | sshpass -p "$SFTP_PASSWORD" sftp -oBatchMode=no -oStrictHostKeyChecking=no -oPort=${SFTP_PORT:-22} "$SFTP_USER@$HOST"
          echo "SFTP login succeeded, starting lftp mirror..."
          cat > /tmp/lftp-commands.txt <<'EOF'
set sftp:auto-confirm yes
set sftp:connect-program "ssh -a -x -o BatchMode=no -o StrictHostKeyChecking=no -p %p"
mirror --reverse --delete --verbose ./ "$REMOTE_DIR"
bye
EOF
          lftp -d "sftp://$SFTP_USER:$SFTP_PASSWORD@$HOST:${SFTP_PORT:-22}" -f /tmp/lftp-commands.txt
